<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AYLIN — Midnight Crescent</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,500;1,300&family=Jost:wght@300;400&display=swap" rel="stylesheet">
<style>
  :root { --bg:#000; --silver:#c9ccd1; --dim:#80848b; }
  * { box-sizing:border-box; margin:0; }
  html,body { height:100%; }
  body { background:var(--bg); color:var(--silver); font-family:'Jost',sans-serif; font-weight:300; overflow-x:hidden;
         display:flex; flex-direction:column; text-align:center; }
  canvas { position:fixed; inset:0; width:100%; height:100%; }
  main { margin:auto; position:relative; z-index:1; padding:24px; display:flex; flex-direction:column; align-items:center; gap:28px; }
  .logo { width:min(420px,78vw,36vh); animation:rise 2.4s ease both, glow 6s ease-in-out infinite 2.4s; }
  @keyframes rise { from { opacity:0; transform:translateY(18px) scale(.97); filter:blur(8px);} to { opacity:1; transform:none; filter:none; } }
  @keyframes glow { 50% { filter:drop-shadow(0 0 28px rgba(200,205,215,.25)); } }
  .soon { font-family:'Cormorant Garamond',serif; font-weight:300; font-size:clamp(18px,2.6vw,26px); letter-spacing:.55em; text-transform:uppercase; padding-left:.55em; animation:rise 2s .8s ease both; }
  .line { width:min(260px,50vw); height:1px; background:linear-gradient(90deg,transparent,var(--silver),transparent); opacity:.5; }
  p { color:var(--dim); font-size:14px; letter-spacing:.08em; max-width:420px; line-height:1.8; animation:rise 2s 1.1s ease both; }
  form { display:flex; border-bottom:1px solid #444; width:min(380px,86vw); animation:rise 2s 1.4s ease both; }
  input { flex:1; background:none; border:0; color:var(--silver); padding:12px 4px; font:inherit; letter-spacing:.1em; outline:none; }
  input::placeholder { color:#5a5d63; }
  button { background:none; border:0; color:var(--silver); letter-spacing:.3em; font:inherit; font-size:12px; text-transform:uppercase; cursor:pointer; padding:0 4px; }
  button:hover { color:#fff; }
  footer { position:relative; z-index:2; text-align:center; padding:18px 16px; font-size:11px; letter-spacing:.3em; color:#555; text-transform:uppercase; }
</style>
</head>
<body>
<canvas id="sky"></canvas>
<main>
  <img class="logo" src="assets/logo-transparent.png" alt="AYLIN — Kashmir, Reimagined">
  <div class="soon">Coming Soon</div>
  <div class="line"></div>
  <p>Handcrafted in Kashmir. Woven by moonlight, made to be worn for a lifetime.</p>
  <form onsubmit="event.preventDefault(); this.innerHTML='<span style=&quot;padding:12px;letter-spacing:.2em&quot;>Thank you — we will be in touch.</span>'">
    <input type="email" placeholder="Your email" required aria-label="Email">
    <button>Notify me</button>
  </form>
</main>
<footer>@aylin &nbsp;·&nbsp; Srinagar, Kashmir</footer>
<script>
const c=document.getElementById('sky'),x=c.getContext('2d');let w,h,stars;
function size(){w=c.width=innerWidth;h=c.height=innerHeight;stars=Array.from({length:Math.floor(w*h/7000)},()=>({x:Math.random()*w,y:Math.random()*h,r:Math.random()*1.2+.2,p:Math.random()*6.28,s:Math.random()*.02+.005}))}
size();addEventListener('resize',size);
(function draw(){x.clearRect(0,0,w,h);for(const s of stars){s.p+=s.s;x.globalAlpha=.25+.55*Math.abs(Math.sin(s.p));x.fillStyle='#dfe3ea';x.beginPath();x.arc(s.x,s.y,s.r,0,6.28);x.fill();s.y-=.03;if(s.y<0)s.y=h}requestAnimationFrame(draw)})();
</script>
</body>
</html>
