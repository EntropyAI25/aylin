<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AYLIN — Pashmina Mist</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,500;1,300&family=Jost:wght@300;400&display=swap" rel="stylesheet">
<style>
  :root { --ivory:#f4f0e8; --stone:#d9d3c7; --graphite:#2a2a2c; --gold:#b08d57; }
  * { box-sizing:border-box; margin:0; }
  html,body { height:100%; }
  body { background:var(--ivory); color:var(--graphite); font-family:'Jost',sans-serif; font-weight:300; min-height:100%;
         display:grid; grid-template-rows:auto 1fr auto; position:relative; overflow-x:hidden; }
  body::before { content:""; position:fixed; inset:0;
    background: radial-gradient(60% 50% at 20% 20%, #fff8 0, transparent 70%), radial-gradient(50% 60% at 85% 80%, var(--stone) 0, transparent 70%);
    animation:drift 18s ease-in-out infinite alternate; }
  @keyframes drift { to { transform:scale(1.12) translate(-2%,2%); } }
  header,main,footer { position:relative; z-index:1; }
  header { display:flex; justify-content:space-between; padding:28px 40px; font-size:11px; letter-spacing:.4em; text-transform:uppercase; }
  main { display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; gap:26px; padding:24px; }
  .logo { width:min(380px,74vw,36vh); filter:invert(1); animation:fade 2s ease both; }
  @keyframes fade { from { opacity:0; transform:translateY(12px);} to { opacity:1; } }
  .rule { width:1px; height:56px; background:var(--gold); }
  h1 { font-family:'Cormorant Garamond',serif; font-weight:300; font-size:clamp(28px,4.4vw,52px); line-height:1.15; animation:fade 2s .5s ease both; }
  h1 em { color:var(--gold); }
  p { max-width:430px; line-height:1.9; font-size:14px; letter-spacing:.06em; color:#58554f; animation:fade 2s .8s ease both; }
  form { display:flex; width:min(420px,88vw); border:1px solid var(--graphite); animation:fade 2s 1.1s ease both; }
  input { flex:1; background:transparent; border:0; padding:14px 16px; font:inherit; letter-spacing:.08em; outline:none; color:var(--graphite); }
  button { background:var(--graphite); color:var(--ivory); border:0; padding:0 24px; font:inherit; font-size:11px; letter-spacing:.3em; text-transform:uppercase; cursor:pointer; }
  button:hover { background:#000; }
  footer { text-align:center; padding:22px; font-size:11px; letter-spacing:.35em; text-transform:uppercase; color:#8a867d; }
</style>
</head>
<body>
<header><span>Est. Kashmir</span><span>Coming Soon</span></header>
<main>
  <img class="logo" src="assets/logo-transparent.png" alt="AYLIN — Kashmir, Reimagined">
  <div class="rule"></div>
  <h1>Softness, <em>spun by hand.</em></h1>
  <p>Authentic Kashmiri craft, reimagined for the way you live now. A considered collection, arriving soon.</p>
  <form onsubmit="event.preventDefault(); this.innerHTML='<span style=&quot;padding:14px 16px&quot;>Thank you — we will write to you soon.</span>'">
    <input type="email" placeholder="Your email" required aria-label="Email">
    <button>Join</button>
  </form>
</main>
<footer>@aylin &nbsp;·&nbsp; Handcrafted in Kashmir</footer>
</body>
</html>
